<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirect 404s to index.html with route preserved in hash or query
      const pathSegments = window.location.pathname.split('/');
      const repoName = pathSegments[1] || '';
      window.location.replace('/' + repoName + '/?p=' + encodeURIComponent(window.location.pathname.slice(repoName.length + 1) + window.location.search));
    </script>
  </head>
  <body>
  </body>
</html>
